server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: jdbc:oracle:thin:@tcps://[NOMBRE_DE_TU_DB_EN_LA_NUBE]?TNS_ADMIN=/ruta/absoluta/a/tu/wallet_descargada
    username: [USUARIO_ADMIN_O_APP]
    password: [CONTRASEÑA_SEGURA]
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect
